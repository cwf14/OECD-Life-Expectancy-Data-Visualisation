name: Life Expectancy in OECD Countries - COS30045 Data Visualisation 

on:
  push:
    branches: ["main"]   # Change to "master" if your default branch is master
  workflow_dispatch:     # Allows you to run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Pages looks for index.html at the root URL.
      # This copies Main.html -> index.html during deployment without changing your repo.
      - name: Set Main.html as index.html
        run: cp Main.html index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4